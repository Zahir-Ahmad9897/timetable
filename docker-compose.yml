version: '3.8'

services:
  timetable-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    image: iridai/timetable:latest
    container_name: iridai-timetable-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - APP_BASE_URL=${APP_BASE_URL:-https://timetable.irid.ai}
      - APP_BASE_PATH=${APP_BASE_PATH:-/timetable}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_DB_FILE=/app/server-data/auth.sqlite
      - UET_MARDAN_EMAIL=${UET_MARDAN_EMAIL:-uetmardan@gmail.com}
      - UET_MARDAN_PASSWORD=${UET_MARDAN_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRO_MONTHLY_PRICE_ID=${STRIPE_PRO_MONTHLY_PRICE_ID}
      - STRIPE_PRO_YEARLY_PRICE_ID=${STRIPE_PRO_YEARLY_PRICE_ID}
      - STRIPE_ENTERPRISE_MONTHLY_PRICE_ID=${STRIPE_ENTERPRISE_MONTHLY_PRICE_ID}
      - STRIPE_ENTERPRISE_YEARLY_PRICE_ID=${STRIPE_ENTERPRISE_YEARLY_PRICE_ID}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - timetable-data:/app/server-data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  reverse-proxy:
    image: nginx:alpine
    container_name: iridai-timetable-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      timetable-app:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

volumes:
  timetable-data:
